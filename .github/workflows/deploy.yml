name: Deploy

# Trigger: only on pushes to main branch (after CI passes)
on:
  push:
    branches: [main]

# Prevent concurrent deploys — if a deploy is already running, cancel it
# so the latest commit always wins.
concurrency:
  group: production_deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production (Oracle Cloud)
    runs-on: ubuntu-latest
    # Only deploy if CI workflow passes first.
    # This job will be skipped automatically if the CI jobs fail
    # because GitHub requires all required status checks to pass.

    environment:
      name: production
      url: https://YOUR_DOMAIN  # Replace with your actual domain after provisioning

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Ruby + Kamal ──────────────────────────────────────────────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # ── 3. Docker Buildx (required for ARM64 cross-platform builds) ──────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Use QEMU for ARM64 emulation on the amd64 GitHub Actions runner
          platforms: linux/arm64

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # ── 4. Write SSH private key for server access ───────────────────────────
      # The private key must be stored in GitHub Secrets as DEPLOY_SSH_PRIVATE_KEY.
      # The matching public key must be in ~/.ssh/authorized_keys on the server.
      - name: Set up SSH key for server access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Trust the server's host key (avoids interactive prompt during deploy)
          ssh-keyscan -H ${{ secrets.DEPLOY_SERVER_IP }} >> ~/.ssh/known_hosts

      # ── 5. Deploy with Kamal 2 ───────────────────────────────────────────────
      - name: Deploy with Kamal
        env:
          # GitHub Container Registry credentials
          KAMAL_REGISTRY_USERNAME: ram1241
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          # Rails master key (decrypts config/credentials.yml.enc)
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bin/kamal deploy
